<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Agent Hub - Authentication</title>
  <link rel="stylesheet" href="auth.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <div class="brand">
        <div class="logo">AI</div>
        <div>
          <h1>AI Agent Hub</h1>
          <p>AI assistants for modern businesses</p>
        </div>
      </div>

      <div class="form-area">
        <h2 id="modeTitle">Create your account</h2>
        <p class="subtitle">Manage your AI agents from one place.</p>

        <form id="authForm">
          <div id="nameField" class="field">
            <label for="fullName">Full Name</label>
            <input id="fullName" type="text" placeholder="Your name">
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="you@example.com" required>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Minimum 6 characters" minlength="6" required>
          </div>

          <button id="submitBtn" type="submit">Create Account</button>
          <div id="message" class="message"></div>
        </form>

        <div class="switch">
          <span id="switchText">Already have an account?</span>
          <button id="switchBtn" type="button">Login</button>
        </div>
      </div>
    </section>
  </main>

  <script src="auth.js"></script>
</body>
</html>
